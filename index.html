<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clang AST Visualizer</title>

<style>
  :root {
    --bg: #ffffff;
    --panel: #f7f8fa;
    --border: #d8dce3;
    --text: #1a1d23;
    --muted: #6b7280;
    --accent: #2563eb;
    --edge: #b6bcc7;
    --shadow: 0 1px 3px rgba(0,0,0,.10), 0 4px 12px rgba(0,0,0,.05);

    --f-decl:     #2563eb;
    --f-stmt:     #15803d;
    --f-expr:     #b45309;
    --f-type:     #7c3aed;
    --f-attr:     #475569;
    --f-template: #0d9488;
    --f-pseudo:   #9ca3af;
    --f-comment:  #0369a1;
    --f-other:    #52525b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --panel: #1b1e24;
      --border: #2f343d;
      --text: #e6e8ec;
      --muted: #9aa1ad;
      --accent: #60a5fa;
      --edge: #3b414c;
      --shadow: 0 1px 3px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.35);

      --f-decl:     #60a5fa;
      --f-stmt:     #4ade80;
      --f-expr:     #fbbf24;
      --f-type:     #c084fc;
      --f-attr:     #94a3b8;
      --f-template: #2dd4bf;
      --f-pseudo:   #6b7280;
      --f-comment:  #38bdf8;
      --f-other:    #a1a1aa;
    }
  }
  /* The viewer's theme toggle must win over the media query in both directions. */
  :root[data-theme="light"] {
    --bg:#fff; --panel:#f7f8fa; --border:#d8dce3; --text:#1a1d23; --muted:#6b7280;
    --accent:#2563eb; --edge:#b6bcc7; --shadow:0 1px 3px rgba(0,0,0,.10),0 4px 12px rgba(0,0,0,.05);
    --f-decl:#2563eb; --f-stmt:#15803d; --f-expr:#b45309; --f-type:#7c3aed;
    --f-attr:#475569; --f-template:#0d9488; --f-pseudo:#9ca3af;
    --f-comment:#0369a1; --f-other:#52525b;
  }
  :root[data-theme="dark"] {
    --bg:#14161a; --panel:#1b1e24; --border:#2f343d; --text:#e6e8ec; --muted:#9aa1ad;
    --accent:#60a5fa; --edge:#3b414c; --shadow:0 1px 3px rgba(0,0,0,.5),0 4px 14px rgba(0,0,0,.35);
    --f-decl:#60a5fa; --f-stmt:#4ade80; --f-expr:#fbbf24; --f-type:#c084fc;
    --f-attr:#94a3b8; --f-template:#2dd4bf; --f-pseudo:#6b7280;
    --f-comment:#38bdf8; --f-other:#a1a1aa;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }

  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 14px; font-weight: 650; margin: 0 8px 0 0; white-space: nowrap; }
  header .grow { flex: 1; }
  #commentsLabel {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12.5px; color: var(--muted); white-space: nowrap; cursor: pointer;
  }
  #commentsLabel input { cursor: pointer; margin: 0; accent-color: var(--accent); }

  button, select {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; cursor: pointer;
  }
  button:hover:not(:disabled), select:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); }

  main { flex: 1; display: flex; min-height: 0; }

  #left {
    width: 380px; min-width: 220px; max-width: 60vw;
    display: flex; flex-direction: column;
    border-right: 1px solid var(--border); background: var(--panel);
  }
  #left label { padding: 8px 12px 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
  #source {
    flex: 1; margin: 0 12px 8px; padding: 10px; resize: none;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 12.5px; line-height: 1.5; tab-size: 4;
  }
  #source:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #privacy { padding: 0 12px 10px; font-size: 11.5px; color: var(--muted); }
  #privacy code { font-size: 11px; }

  #stage { flex: 1; position: relative; min-width: 0; background: var(--bg); }
  #canvas { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #canvas.panning { cursor: grabbing; }

  #toolbar {
    position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; flex-wrap: wrap;
    background: color-mix(in srgb, var(--panel) 88%, transparent);
    padding: 6px; border: 1px solid var(--border); border-radius: 8px; backdrop-filter: blur(6px);
  }
  #toolbar button { padding: 4px 9px; font-size: 12.5px; }
  #toolbar #zoomIn, #toolbar #zoomOut {
    font-size: 15px; line-height: 1; min-width: 30px; font-weight: 600;
  }
  #zoomLevel {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 46px; font-size: 12px; color: var(--muted);
    font-variant-numeric: tabular-nums; user-select: none;
  }

  #legend {
    position: absolute; bottom: 10px; left: 10px; display: flex; gap: 10px; flex-wrap: wrap;
    background: color-mix(in srgb, var(--panel) 88%, transparent);
    padding: 7px 9px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 11.5px; backdrop-filter: blur(6px);
  }
  #legend span { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
  #legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

  #status {
    position: absolute; top: 10px; right: 10px; max-width: 46%;
    padding: 8px 11px; border-radius: 8px; font-size: 12.5px;
    border: 1px solid var(--border); background: var(--panel); box-shadow: var(--shadow);
    white-space: pre-wrap; display: none;
  }
  #status.error { border-color: #dc2626; color: #dc2626; }
  #status.show { display: block; }
  #status .close { float: right; margin-left: 10px; cursor: pointer; color: var(--muted); }

  #detail {
    position: absolute; top: 0; right: 0; bottom: 0; width: 400px; max-width: 85%;
    background: var(--panel); border-left: 1px solid var(--border);
    box-shadow: var(--shadow); padding: 14px; overflow: auto;
    transform: translateX(100%); transition: transform .18s ease;
  }
  #detail.open { transform: none; }
  #detail h2 { margin: 0 0 10px; font-size: 15px; }
  #detail .close { position: absolute; top: 10px; right: 12px; cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1; }
  #detail dt { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-top: 12px; }
  #detail dd {
    margin: 3px 0 0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px; word-break: break-word; white-space: pre-wrap;
  }
  #detail ul { margin: 3px 0 0; padding-left: 18px; }
  #detail li { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; word-break: break-word; }

  #empty {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px; text-align: center; padding: 24px; pointer-events: none;
  }

  /* --- tree --- */
  .edge { fill: none; stroke: var(--edge); stroke-width: 1.5px; }
  .node { cursor: pointer; }
  .node rect {
    fill: var(--bg); stroke: var(--nodecolor, var(--f-other)); stroke-width: 1.5px; rx: 6;
  }
  .node.selected rect { stroke-width: 3px; }
  .node.pseudo rect { stroke-dasharray: 4 3; }
  .node text { pointer-events: none; }
  .node .kind { font-size: 12.5px; font-weight: 650; fill: var(--nodecolor, var(--f-other)); }
  .node .name {
    font-size: 11.5px; fill: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .toggle circle { fill: var(--panel); stroke: var(--edge); stroke-width: 1.5px; }
  .toggle text { font-size: 10px; fill: var(--muted); text-anchor: middle; font-weight: 700; }
  .toggle:hover circle { stroke: var(--accent); }
</style>

<header>
  <h1>Clang AST Visualizer</h1>
  <select id="compiler" title="Compiler (clang only — AST output is clang-specific)"></select>
  <input id="args" class="mono" placeholder="extra flags, e.g. -std=c++20" style="width:200px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:12.5px">
  <label id="commentsLabel" title="Adds -fparse-all-comments, so comments attached to a declaration appear as nodes. Comments in statement position are dropped by clang regardless.">
    <input type="checkbox" id="comments" checked> Comments
  </label>
  <button id="render" class="primary">▶ Render</button>
  <span class="grow"></span>
  <button id="theme" title="Toggle light/dark">◐</button>
</header>

<main>
  <div id="left">
    <label for="source">C++ source</label>
    <textarea id="source" spellcheck="false"></textarea>
    <p id="privacy">
      Your source is sent to <b>godbolt.org</b> (Compiler Explorer) to be compiled.
      Nothing is stored locally and the request opts out of code-sharing storage.
    </p>
  </div>

  <div id="stage">
    <svg id="canvas"><g id="viewport"></g></svg>

    <div id="toolbar">
      <button id="zoomIn" title="Zoom in">+</button>
      <button id="zoomOut" title="Zoom out">−</button>
      <span id="zoomLevel" title="Current zoom">100%</span>
      <button id="fit">Fit</button>
      <button id="reset" title="Reset zoom to 100%">Reset</button>
      <button id="expandAll" title="Expand every subtree">Expand</button>
      <button id="collapseAll" title="Collapse to the root">Collapse</button>
      <button id="exportSvg" title="Download as SVG">SVG</button>
      <button id="exportPng" title="Download as PNG">PNG</button>
    </div>

    <div id="legend"></div>
    <div id="status"></div>
    <!-- The inner <span> matters: #empty is a flex container, and without it the
         text runs become anonymous flex items whose edge whitespace is stripped,
         rendering "hit Render" as "hitRender". -->
    <div id="empty"><span>Paste C++ on the left and hit <b>Render</b>.</span></div>

    <aside id="detail">
      <span class="close" id="detailClose">×</span>
      <h2 id="dKind"></h2>
      <dl id="dBody"></dl>
    </aside>
  </div>
</main>

/**
 * Split a node's body into ordered atoms, respecting single-quoted strings.
 * Angle/paren/square groups are matched by depth and are quote-aware, which is
 * required because types contain '<' '>' ('basic_string<char> (*)(...)') and
 * operators are printed as quoted text ('<<', '<dependent type>').
 */
function tokenizeBody(body) {
  const atoms = [];
  let i = 0;
  const n = body.length;

  // Quote state tracks BOTH quote characters. Comment nodes carry double-quoted
  // payloads such as `Text="<angle"`, where an unbalanced '<' would otherwise be
  // read as the start of a bracket group.
  const readGroup = (open, close) => {
    let depth = 0, quote = null, start = i;
    while (i < n) {
      const c = body[i];
      if (quote) { if (c === quote) quote = null; }
      else if (c === "'" || c === '"') quote = c;
      else if (c === open) depth++;
      else if (c === close) { depth--; if (depth === 0) { i++; break; } }
      i++;
    }
    return body.slice(start, i);
  };

  while (i < n) {
    const c = body[i];
    if (c === " ") { i++; continue; }

    if (c === "'") {
      const readQuoted = () => {
        const start = i; i++;
        while (i < n && body[i] !== "'") i++;
        i++; // closing quote
        return body.slice(start, i);
      };
      atoms.push({ t: "q", v: readQuoted() });
      // Clang writes sugared types as 'string':'std::basic_string<char>'.
      // Emit the desugared form as its own atom rather than letting the
      // `:'...'` tail leak into the bare-token stream.
      while (body[i] === ":" && body[i + 1] === "'") {
        i++;
        atoms.push({ t: "q", desugared: true, v: readQuoted() });
      }
    } else if (c === "<") {
      atoms.push({ t: "angle", v: readGroup("<", ">") });
    } else if (c === "(") {
      atoms.push({ t: "paren", v: readGroup("(", ")") });
    } else if (c === "[") {
      atoms.push({ t: "square", v: readGroup("[", "]") });
    } else {
      // Bare token: run to the next space that is not inside quotes, so
      // `ComputeLHSTy='int'` and `Text="<angle"` each stay one atom. Stop before
      // an opening group so `nrvo_candidate(...)` splits into word + paren group.
      const start = i; let quote = null;
      while (i < n) {
        const ch = body[i];
        if (quote) { if (ch === quote) quote = null; }
        else if (ch === "'" || ch === '"') quote = ch;
        else if (ch === " " || ch === "(" || ch === "<" || ch === "[") break;
        i++;
      }
      atoms.push({ t: "b", v: body.slice(start, i) });
    }
  }
  return atoms;
}

function parseBody(body, raw) {
  const node = {
    kind: "", id: null, range: null,
    quoted: [], bare: [], rest: [], raw, children: []
  };

  if (body.startsWith("<<<NULL>>>")) {
    node.kind = "<<<NULL>>>";
    return node;
  }

  const atoms = tokenizeBody(body);
  if (!atoms.length) { node.kind = body.trim() || "?"; return node; }

  node.kind = atoms[0].v;
  let idx = 1;

  // Optional address, then optional `parent 0x..` / `prev 0x..`, all before the range.
  while (idx < atoms.length && atoms[idx].t === "b") {
    const v = atoms[idx].v;
    if (/^0x[0-9a-f]+$/i.test(v) && node.id === null) { node.id = v; idx++; continue; }
    if ((v === "parent" || v === "prev") && atoms[idx + 1] && /^0x/i.test(atoms[idx + 1].v)) {
      node[v] = atoms[idx + 1].v; idx += 2; continue;
    }
    break;
  }

  // First angle group is the source range; later ones are attributes (<NoOp>, <LValueToRValue>).
  if (idx < atoms.length && atoms[idx].t === "angle") { node.range = atoms[idx].v; idx++; }

  for (; idx < atoms.length; idx++) {
    const a = atoms[idx];
    node.rest.push(a);
    if (a.t === "q") node.quoted.push(a.v.slice(1, -1));
    else if (a.t === "b") node.bare.push(a.v);
  }
  return node;
}

/* Decl kinds clang prints before the name of a *referenced* declaration,
   as in `DeclRefExpr ... lvalue ParmVar 0x448d5930 'a' 'string':'...'`. */
const DECL_MARKERS = new Set([
  "Var","ParmVar","Function","CXXMethod","CXXConstructor","CXXDestructor",
  "CXXConversion","Namespace","Field","EnumConstant","Enum","Typedef","TypeAlias",
  "NonTypeTemplateParm","TemplateTypeParm","Record","CXXRecord","IndirectField",
  "Binding","MSProperty","ObjCIvar","CXXTemporary"
]);

/** The identifier shown under the node kind. */
function primaryLabel(node) {
  if (node.kind === "<<<NULL>>>") return "";

  // Comment nodes carry their text in a Text="..." attribute.
  if (/Comment$/.test(node.kind)) {
    const text = node.bare.find(v => /^Text=/.test(v));
    if (text) return text.slice(6, -1).trim() || text.slice(5);
    const param = node.bare.find(v => /^Param=/.test(v));
    if (param) return param.slice(7, -1);
  }

  // Operator spelling is the trailing quoted symbol: '<', '++', '<<=', '+'.
  const last = node.quoted[node.quoted.length - 1];
  if (last && /^[^\w\s]{1,3}$/.test(last) &&
      (/Operator$/.test(node.kind) || /OperatorCallExpr$/.test(node.kind))) {
    return last;
  }

  // Referenced declaration: the quoted atom following a decl-kind marker.
  // Uses `rest` because position matters — the type is also quoted.
  for (let i = 0; i < node.rest.length; i++) {
    const a = node.rest[i];
    if (a.t === "b" && DECL_MARKERS.has(a.v)) {
      for (let j = i + 1; j < node.rest.length; j++) {
        if (node.rest[j].t === "q") return node.rest[j].v.slice(1, -1);
      }
    }
  }

  // Declared name: last bare word that is not a location, address, or attribute.
  const named = node.bare.filter(v =>
    !isLocationToken(v) && !/^0x[0-9a-f]+$/i.test(v) &&
    !ATTR_WORDS.has(v) && !/=/.test(v) && /^[~A-Za-z_$][\w$]*$/.test(v)
  );
  if (named.length) return named[named.length - 1];

  // StringLiteral prints its text double-quoted.
  const str = node.bare.find(v => v.startsWith('"'));
  if (str) return str;

  // Numeric literals print a bare value (IntegerLiteral ... 'int' 0).
  const value = node.bare.filter(v => /^[-+]?[\d.]/.test(v) && !isLocationToken(v));
  if (value.length) return value[value.length - 1];

  // Otherwise a short quoted identifier ('std', 'BaseA', 'operator+').
  const ident = node.quoted.find(v => /^[~A-Za-z_$][\w$]*$/.test(v) || /^operator/.test(v));
  if (ident) return ident;

  // Otherwise the node's type is the most useful thing to show.
  if (node.quoted.length) return node.quoted[0];

  // Pseudo-nodes such as `Overrides: [ ... ]` carry their payload in a group.
  const group = node.rest.find(a => a.t === "square" || a.t === "paren");
  if (group) return group.v.slice(1, -1).trim();

  return "";
}

function family(kind) {
  if (PSEUDO_KINDS.has(kind)) return "pseudo";
  // Doc comments become real nodes: FullComment > ParagraphComment > TextComment.
  if (/Comment$/.test(kind)) return "comment";
  if (/Attr$/.test(kind)) return "attr";
  if (/Decl$/.test(kind)) return "decl";
  if (/Stmt$/.test(kind)) return "stmt";
  if (/(Expr|Literal|Operator)$/.test(kind)) return "expr";
  if (/Type$/.test(kind)) return "type";
  if (/^Template|Specialization$/.test(kind)) return "template";
  return "other";
}

/**
 * Parse a clang AST dump into a single root.
 *
 * Depth comes from the indent prefix: a run of 2-char groups from {"| ", "  "}
 * terminated by "|-" or "`-". Verified against 53,994 lines of clang output
 * with zero violations.
 *
 * Handles both a bare single-root dump (what `produceAst` returns) and the
 * multi-block `Dumping <name>:` shape that `-ast-dump-filter` produces; in the
 * latter case the roots are joined under a synthetic node.
 */
function parseAst(text) {
  const lines = String(text).split("\n");
  const roots = [];
  let stack = [];
  let pendingTitle = null;

  for (let line of lines) {
    line = line.replace(/\r$/, ""); // tolerate CRLF-terminated dumps
    if (!line.trim()) { stack = []; continue; }

    const dumping = /^Dumping ([^:]*):\s*$/.exec(line);
    if (dumping) { pendingTitle = dumping[1]; stack = []; continue; }
    if (/^\[Truncated\]$/.test(line.trim())) continue;

    let j = 0;
    while (j + 1 < line.length) {
      const g = line.slice(j, j + 2);
      if (g === "| " || g === "  ") j += 2; else break;
    }
    const tok = line.slice(j, j + 2);

    let depth, body;
    if (tok === "|-" || tok === "`-") { depth = j / 2 + 1; body = line.slice(j + 2); }
    else if (j === 0) { depth = 0; body = line; }
    else { continue; } // indented but no connector — not a node line

    const node = parseBody(body, line);
    node.depth = depth;

    if (depth === 0) {
      if (pendingTitle) { node.title = pendingTitle; pendingTitle = null; }
      roots.push(node);
      stack = [node];
    } else {
      const parent = stack[depth - 1];
      if (!parent) continue; // malformed indentation — skip rather than throw
      parent.children.push(node);
      stack[depth] = node;
      stack.length = depth + 1;
    }
  }

  if (roots.length === 0) return null;
  if (roots.length === 1) return roots[0];
  return {
    kind: "TranslationUnit", id: null, range: null, synthetic: true,
    quoted: [], bare: [], rest: [], raw: `${roots.length} declarations`,
    depth: 0, children: roots
  };
}

function countNodes(node) {
  let n = 1;
  for (const c of node.children || []) n += countNodes(c);
  return n;
}

/* PARSER_END */

/* ==========================================================================
   Godbolt (Compiler Explorer) client
   ========================================================================== */

/* Verified live against the API. `produceAst` is a backend option, not a
   compiler flag: it makes CE run the dump and scope it to the user's own code.
   Passing `-Xclang -ast-dump` via userArguments instead returns the whole
   translation unit, which is truncated by the server and loses the user's code. */
const COMPILERS = [
  ["clang2210", "clang 22.1.0"],
  ["clang2110", "clang 21.1.0"],
  ["clang2010", "clang 20.1.0"],
  ["clang1910", "clang 19.1.0"],
  ["clang1810", "clang 18.1.0"],
  ["clang1701", "clang 17.0.1"],
];

async function fetchAst(source, compilerId, userArguments) {
  const res = await fetch(`https://godbolt.org/api/compiler/${encodeURIComponent(compilerId)}/compile`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json" },
    body: JSON.stringify({
      source,
      compiler: compilerId,
      lang: "c++",
      allowStoreCodeDebug: false,
      options: {
        userArguments: userArguments || "",
        compilerOptions: { skipAsm: true, executorRequest: false, produceAst: true },
        filters: { execute: false, binary: false, commentOnly: true, trim: false },
        tools: [], libraries: []
      }
    })
  });
  if (!res.ok) throw new Error(`Compiler Explorer returned HTTP ${res.status}`);
  const data = await res.json();
  // CE returns colour-coded diagnostics; strip the ANSI escapes so they do not
  // render as literal \e[0;1;31m noise in the status strip.
  const stripAnsi = s => s.replace(/\x1b\[[0-9;]*[A-Za-z]/g, "");
  const textOf = arr =>
    stripAnsi((arr || []).map(e => (typeof e === "string" ? e : e.text)).join("\n"));
  return {
    ast: textOf(data.astOutput),
    stderr: textOf(data.stderr),
    code: data.code,
    truncated: !!data.truncated
  };
}

/* ==========================================================================
   Render
   ========================================================================== */

const NODE_W = 196, NODE_H = 44, GAP_X = 24, GAP_Y = 54;
const COLLAPSE_THRESHOLD = 2000;

const svg = document.getElementById("canvas");
const viewport = document.getElementById("viewport");
const detail = document.getElementById("detail");
const statusEl = document.getElementById("status");
const emptyEl = document.getElementById("empty");

let astRoot = null;
let selected = null;
let view = { x: 0, y: 0, k: 1 };

const SVGNS = "http://www.w3.org/2000/svg";
const el = (name, attrs = {}) => {
  const e = document.createElementNS(SVGNS, name);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
};

function truncate(s, max) {
  s = String(s == null ? "" : s);
  return s.length <= max ? s : s.slice(0, max - 1) + "…";
}

function applyView() {
  viewport.setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.k})`);
  const readout = document.getElementById("zoomLevel");
  if (readout) readout.textContent = Math.round(view.k * 100) + "%";
}

function render() {
  viewport.textContent = "";
  if (!astRoot) return;

  const h = d3.hierarchy(astRoot, d => (d._collapsed ? null : d.children));
  d3.tree().nodeSize([NODE_W + GAP_X, NODE_H + GAP_Y])(h);

  const edges = el("g");
  const nodes = el("g");
  viewport.append(edges, nodes);

  for (const link of h.links()) {
    const { source: s, target: t } = link;
    const y1 = s.y + NODE_H / 2, y2 = t.y - NODE_H / 2, mid = (y1 + y2) / 2;
    edges.appendChild(el("path", {
      class: "edge",
      d: `M${s.x},${y1} V${mid} H${t.x} V${y2}`
    }));
  }

  for (const d of h.descendants()) {
    const data = d.data;
    const fam = family(data.kind);
    const g = el("g", {
      class: `node ${fam}${selected === data ? " selected" : ""}`,
      transform: `translate(${d.x},${d.y})`,
      style: `--nodecolor: var(--f-${fam})`
    });

    g.appendChild(el("rect", {
      x: -NODE_W / 2, y: -NODE_H / 2, width: NODE_W, height: NODE_H
    }));

    const kind = el("text", { class: "kind", x: 0, y: -3, "text-anchor": "middle" });
    kind.textContent = truncate(data.kind, 26);
    g.appendChild(kind);

    const label = primaryLabel(data);
    if (label) {
      const nameEl = el("text", { class: "name", x: 0, y: 13, "text-anchor": "middle" });
      nameEl.textContent = truncate(label, 28);
      g.appendChild(nameEl);
    }

    const title = el("title");
    title.textContent = data.raw || data.kind;
    g.appendChild(title);

    g.addEventListener("click", ev => {
      if (dragMoved) return; // finished a pan, not a click
      ev.stopPropagation();
      select(data);
    });
    nodes.appendChild(g);

    const kidCount = (data.children || []).length;
    if (kidCount) {
      const toggle = el("g", {
        class: "toggle",
        transform: `translate(${d.x},${d.y + NODE_H / 2 + 10})`
      });
      const collapsed = !!data._collapsed;
      toggle.appendChild(el("circle", { r: collapsed ? 11 : 8 }));
      const t = el("text", { y: 3.5 });
      t.textContent = collapsed ? `+${countNodes(data) - 1}` : "−";
      toggle.appendChild(t);
      toggle.addEventListener("click", ev => {
        if (dragMoved) return; // finished a pan, not a click
        ev.stopPropagation();
        data._collapsed = !data._collapsed;
        render();
      });
      nodes.appendChild(toggle);
    }
  }
  applyView();
}

function select(data) {
  selected = data;
  document.getElementById("dKind").textContent = data.kind;
  const body = document.getElementById("dBody");
  body.textContent = "";

  const row = (term, value) => {
    if (value == null || value === "" || (Array.isArray(value) && !value.length)) return;
    const dt = document.createElement("dt"); dt.textContent = term;
    const dd = document.createElement("dd");
    if (Array.isArray(value)) {
      const ul = document.createElement("ul");
      for (const v of value) {
        const li = document.createElement("li"); li.textContent = v; ul.appendChild(li);
      }
      dd.appendChild(ul);
    } else {
      dd.textContent = value;
    }
    body.append(dt, dd);
  };

  row("Address", data.id);
  row("Source range", data.range);
  row("Types / names", data.quoted);
  row("Attributes", data.bare.filter(v => !/^0x[0-9a-f]+$/i.test(v)));
  row("Children", String((data.children || []).length));
  row("Raw", data.raw);

  detail.classList.add("open");
  render();
}

/* --- pan & zoom (hand-rolled; avoids d3-zoom's 8 transitive dependencies) ---
   Deliberately NOT using setPointerCapture: capturing on the <svg> retargets the
   subsequent click to the <svg>, so clicks never reach the node/toggle <g> elements
   and collapsing silently stops working. Instead, listen on window and use a small
   movement threshold to tell a drag apart from a click. */
const DRAG_SLOP = 4;
let dragging = false, lastX = 0, lastY = 0, downX = 0, downY = 0, dragMoved = false;

svg.addEventListener("pointerdown", ev => {
  if (ev.button !== 0) return;
  dragging = true; dragMoved = false;
  lastX = downX = ev.clientX;
  lastY = downY = ev.clientY;
  svg.classList.add("panning");
});
window.addEventListener("pointermove", ev => {
  if (!dragging) return;
  view.x += ev.clientX - lastX;
  view.y += ev.clientY - lastY;
  lastX = ev.clientX; lastY = ev.clientY;
  if (Math.abs(ev.clientX - downX) > DRAG_SLOP || Math.abs(ev.clientY - downY) > DRAG_SLOP) {
    dragMoved = true;
  }
  applyView();
});
const endPan = () => { dragging = false; svg.classList.remove("panning"); };
window.addEventListener("pointerup", endPan);
window.addEventListener("pointercancel", endPan);

svg.addEventListener("wheel", ev => {
  ev.preventDefault();
  const rect = svg.getBoundingClientRect();
  // Trackpad pinch arrives as wheel with ctrlKey; treat it as a stronger zoom.
  const factor = Math.exp(-ev.deltaY * (ev.ctrlKey ? 0.01 : 0.0018));
  zoomBy(factor, ev.clientX - rect.left, ev.clientY - rect.top);
}, { passive: false });

svg.addEventListener("click", () => {
  if (dragMoved) return;
  detail.classList.remove("open");
});

/** Zoom by a factor about a point in viewport coordinates (defaults to centre). */
function zoomBy(factor, px, py) {
  const rect = svg.getBoundingClientRect();
  if (px == null) px = rect.width / 2;
  if (py == null) py = rect.height / 2;
  const k = Math.min(4, Math.max(0.04, view.k * factor));
  const ratio = k / view.k;
  view.x = px - (px - view.x) * ratio;
  view.y = py - (py - view.y) * ratio;
  view.k = k;
  applyView();
}

function fit() {
  if (!astRoot) return;
  const bbox = viewport.getBBox();
  if (!bbox.width || !bbox.height) return;
  const rect = svg.getBoundingClientRect();
  const pad = 40;
  const k = Math.min(
    (rect.width - pad * 2) / bbox.width,
    (rect.height - pad * 2) / bbox.height,
    1.4
  );
  view.k = Math.max(0.04, k);
  view.x = rect.width / 2 - (bbox.x + bbox.width / 2) * view.k;
  view.y = rect.height / 2 - (bbox.y + bbox.height / 2) * view.k;
  applyView();
}

/**
 * Deepest level whose cumulative node count still fits the budget.
 * A fixed depth is not safe: in a full translation unit depth 3 alone holds
 * ~10k nodes, so "collapse to depth 3" would still render 10,926 of them.
 */
function chooseCollapseDepth(root, budget) {
  const perDepth = [];
  (function walk(n, d) {
    perDepth[d] = (perDepth[d] || 0) + 1;
    for (const c of n.children || []) walk(c, d + 1);
  })(root, 0);

  let cumulative = 0, best = 1;
  for (let d = 0; d < perDepth.length; d++) {
    if (cumulative + perDepth[d] > budget) break;
    cumulative += perDepth[d];
    best = d;
  }
  return { depth: Math.max(1, best), visible: cumulative };
}

function setCollapsedAll(collapsed, maxDepth = Infinity) {
  const walk = (n, depth) => {
    if ((n.children || []).length) n._collapsed = collapsed && depth >= maxDepth;
    for (const c of n.children || []) walk(c, depth + 1);
  };
  if (astRoot) walk(astRoot, 0);
}

function showStatus(msg, isError) {
  statusEl.className = "show" + (isError ? " error" : "");
  statusEl.textContent = msg;
  const x = document.createElement("span");
  x.className = "close"; x.textContent = "×";
  x.onclick = () => statusEl.classList.remove("show");
  statusEl.prepend(x);
}

/* ==========================================================================
   Export
   ========================================================================== */

function serializeSvg() {
  const bbox = viewport.getBBox();
  const pad = 24;
  const clone = svg.cloneNode(true);
  clone.setAttribute("xmlns", SVGNS);
  clone.setAttribute("width", Math.ceil(bbox.width + pad * 2));
  clone.setAttribute("height", Math.ceil(bbox.height + pad * 2));
  clone.setAttribute("viewBox",
    `${bbox.x - pad} ${bbox.y - pad} ${bbox.width + pad * 2} ${bbox.height + pad * 2}`);
  clone.querySelector("#viewport").removeAttribute("transform");

  // Resolve CSS custom properties to literal values so the file stands alone.
  const cs = getComputedStyle(document.documentElement);
  const vars = ["--bg","--panel","--border","--text","--muted","--accent","--edge",
                "--f-decl","--f-stmt","--f-expr","--f-type","--f-attr","--f-template",
                "--f-pseudo","--f-comment","--f-other"];
  const decls = vars.map(v => `${v}:${cs.getPropertyValue(v).trim()}`).join(";");
  const style = document.createElementNS(SVGNS, "style");
  style.textContent = `
    svg{${decls};background:var(--bg)}
    .edge{fill:none;stroke:var(--edge);stroke-width:1.5px}
    .node rect{fill:var(--bg);stroke:var(--nodecolor,var(--f-other));stroke-width:1.5px;rx:6}
    .node.pseudo rect{stroke-dasharray:4 3}
    .node .kind{font:650 12.5px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:var(--nodecolor,var(--f-other))}
    .node .name{font:11.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--muted)}
    .toggle circle{fill:var(--panel);stroke:var(--edge);stroke-width:1.5px}
    .toggle text{font:700 10px ui-sans-serif,system-ui,sans-serif;fill:var(--muted);text-anchor:middle}
  `;
  clone.insertBefore(style, clone.firstChild);
  return { markup: new XMLSerializer().serializeToString(clone), bbox, pad };
}

function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

document.getElementById("exportSvg").onclick = () => {
  if (!astRoot) return showStatus("Nothing to export yet.", true);
  const { markup } = serializeSvg();
  download(new Blob([markup], { type: "image/svg+xml" }), "clang-ast.svg");
};

document.getElementById("exportPng").onclick = () => {
  if (!astRoot) return showStatus("Nothing to export yet.", true);
  const { markup, bbox, pad } = serializeSvg();
  const CAP = 16384;
  let scale = 2;
  const w = bbox.width + pad * 2, h = bbox.height + pad * 2;
  if (w * scale > CAP || h * scale > CAP) {
    scale = Math.min(CAP / w, CAP / h);
    showStatus(`Tree is ${Math.round(w)}×${Math.round(h)}px — exporting at ${scale.toFixed(2)}× to stay under the ${CAP}px canvas limit.`);
  }
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.floor(w * scale));
    canvas.height = Math.max(1, Math.floor(h * scale));
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() || "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    canvas.toBlob(b => b && download(b, "clang-ast.png"), "image/png");
  };
  img.onerror = () => showStatus("PNG export failed while rasterizing the SVG.", true);
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(markup);
};

/* ==========================================================================
   Wiring
   ========================================================================== */

const compilerSel = document.getElementById("compiler");
for (const [id, name] of COMPILERS) {
  const o = document.createElement("option");
  o.value = id; o.textContent = name;
  compilerSel.appendChild(o);
}

const LEGEND = [
  ["decl", "Decl"], ["stmt", "Stmt"], ["expr", "Expr"], ["type", "Type"],
  ["attr", "Attr"], ["template", "Template"], ["comment", "Comment"], ["pseudo", "Pseudo"]
];
const legendEl = document.getElementById("legend");
for (const [fam, label] of LEGEND) {
  const s = document.createElement("span");
  const i = document.createElement("i");
  i.style.background = `var(--f-${fam})`;
  s.append(i, document.createTextNode(label));
  legendEl.appendChild(s);
}

document.getElementById("source").value =
  `#include <string>\nusing namespace std;\n\nstring str_concat(string a, string b) {\n    string c = a + b;\n    return c;\n}\n`;

function showTree(text) {
  astRoot = parseAst(text);
  selected = null;
  detail.classList.remove("open");
  if (!astRoot) { emptyEl.style.display = "flex"; render(); return; }
  emptyEl.style.display = "none";

  const total = countNodes(astRoot);
  setCollapsedAll(false);
  if (total > COLLAPSE_THRESHOLD) {
    const { depth, visible } = chooseCollapseDepth(astRoot, COLLAPSE_THRESHOLD);
    setCollapsedAll(true, depth);
    showStatus(
      `${total.toLocaleString()} nodes — collapsed to depth ${depth} ` +
      `(${visible.toLocaleString()} shown) to stay responsive. ` +
      `Click a + badge to open a subtree, or use Expand.`
    );
  }
  render();
  fit();
}

const renderBtn = document.getElementById("render");
renderBtn.onclick = async () => {
  const source = document.getElementById("source").value;
  if (!source.trim()) return showStatus("Nothing to compile — paste some C++ first.", true);

  renderBtn.disabled = true;
  const original = renderBtn.textContent;
  renderBtn.textContent = "Compiling…";
  statusEl.classList.remove("show");

  try {
    // -fparse-all-comments goes first so an explicit user flag can still override it.
    const userArgs = [
      document.getElementById("comments").checked ? "-fparse-all-comments" : "",
      document.getElementById("args").value
    ].filter(s => s && s.trim()).join(" ");

    const { ast, stderr, code, truncated } = await fetchAst(
      source, compilerSel.value, userArgs
    );
    if (!ast || !ast.trim()) {
      astRoot = null;
      viewport.textContent = "";
      emptyEl.style.display = "flex";
      showStatus(stderr ? stderr : `No AST returned (compiler exit code ${code}).`, true);
      return;
    }
    showTree(ast);
    // A failed compile can still yield a partial AST — show it, but never let the
    // failure pass as success.
    if (code !== 0) {
      showStatus(`Compilation failed (exit code ${code}) — showing the partial AST.\n\n${stderr}`.trim(), true);
    } else if (truncated) {
      showStatus("Compiler Explorer truncated the AST output; the tree may be incomplete.", true);
    } else if (stderr && stderr.trim()) {
      showStatus(stderr);
    }
  } catch (err) {
    showStatus(`Request failed: ${err.message}\nThe page needs network access to godbolt.org.`, true);
  } finally {
    renderBtn.disabled = false;
    renderBtn.textContent = original;
  }
};

document.getElementById("zoomIn").onclick = () => zoomBy(1.25);
document.getElementById("zoomOut").onclick = () => zoomBy(1 / 1.25);
document.getElementById("fit").onclick = fit;
document.getElementById("reset").onclick = () => { view = { x: 0, y: 0, k: 1 }; applyView(); };
document.getElementById("expandAll").onclick = () => {
  if (!astRoot) return;
  const total = countNodes(astRoot);
  if (total > COLLAPSE_THRESHOLD &&
      !confirm(`This will show ${total.toLocaleString()} nodes and may be slow. Continue?`)) return;
  setCollapsedAll(false); render(); fit();
};
document.getElementById("collapseAll").onclick = () => {
  setCollapsedAll(true, 1); render(); fit();
};
document.getElementById("detailClose").onclick = () => detail.classList.remove("open");

document.getElementById("theme").onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme
    ? root.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  render();
};

window.addEventListener("resize", () => { if (astRoot) applyView(); });

// Expose for tests / console poking.
window.__ast = { parseAst, parseBody, tokenizeBody, primaryLabel, family, countNodes, showTree };
</script>
